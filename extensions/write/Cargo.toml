[package]
name = "wren-write-extension"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
description = "The complete UTF-8 text write tool for Wren."
repository.workspace = true
publish.workspace = true

[lib]
crate-type = ["cdylib"]

[dependencies]
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
wren-extension = { path = "../../crates/wren-extension" }

[lints]
workspace = true
